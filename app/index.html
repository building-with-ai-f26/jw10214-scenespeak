<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SceneSpeak</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --line: #d9dce1;
    --accent: #2457c5;
    --accent-dark: #1a42a0;
    --good: #1d7a46;
    --good-bg: #eaf6ef;
    --tip: #8a5a00;
    --tip-bg: #fdf4e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { margin: 0; font-size: 28px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  section { margin-top: 32px; }
  h2 { font-size: 20px; margin: 0 0 12px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  textarea {
    width: 100%;
    font: inherit;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
    resize: vertical;
  }
  #source { min-height: 18em; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  button {
    font: inherit;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--accent-dark); }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  .soon { font-size: 12px; color: var(--muted); margin-left: -6px; }
  .note { font-size: 13px; color: var(--muted); margin-top: 8px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h3 { margin: 0 0 8px; font-size: 20px; color: var(--accent); }
  .card h4 {
    margin: 14px 0 4px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .card p { margin: 0; }
  .quote { border-left: 3px solid var(--line); padding-left: 10px; color: #3b4452; }
  .scene { background: var(--bg); border-radius: 6px; padding: 10px 12px; }
  .scene .tag { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .scene .line { margin: 2px 0; }
  .practice textarea { min-height: 3.5em; }
  .practice .scene { margin-bottom: 8px; }
  .row.listen { margin-top: 8px; align-items: center; }
  .hint { font-size: 13px; color: var(--muted); margin-left: 8px; }
  .feedback { margin-top: 10px; border-radius: 6px; padding: 10px 12px; font-size: 14px; }
  .feedback .works { background: var(--good-bg); color: var(--good); padding: 8px 10px; border-radius: 4px; }
  .feedback .tip { background: var(--tip-bg); color: var(--tip); padding: 8px 10px; border-radius: 4px; margin-top: 6px; }
  .feedback .warn { color: var(--muted); }
  .feedback .better { margin-top: 6px; font-weight: 600; }
  .feedback > div + div { margin-top: 6px; }
  #phrasebook ul { list-style: none; margin: 0; padding: 0; }
  #phrasebook li {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  #phrasebook li strong { color: var(--accent); }
  .empty { color: var(--muted); }
  .status { margin-top: 10px; color: var(--muted); }
  .status.error { color: #b42318; background: #fef3f2; border: 1px solid #fecdca; border-radius: 6px; padding: 10px 12px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>SceneSpeak</h1>
    <p>See the scene. Say it right.</p>
  </header>

  <section id="input-section">
    <label for="source">Paste your reading, syllabus, slides, or transcript</label>
    <textarea id="source" rows="14">Thanks for having me today. When I started as a product manager, I thought the job was about shipping features. It is not. Every quarter we ask which projects will really move the needle for our customers. Once we find a winner, we double down on it instead of spreading ourselves thin. Early on, go after the low-hanging fruit, the easy fixes that users notice right away. Before any launch, I make sure engineering, design, and sales are on the same page. If a decision stalls, we park it and circle back once we have more data. At the end of the day, product management is about solving real problems for real people.</textarea>
    <div class="row">
      <button id="find" class="primary" type="button">Find key phrases</button>
      <button id="upload" type="button" disabled>Upload PDF</button>
      <span class="soon">Coming soon</span>
    </div>
    <p class="note">Your text is sent to an AI model to find phrases. Don’t paste private or confidential information.</p>
    <p id="status" class="status hidden" role="status" aria-live="polite"></p>
  </section>

  <section id="results-section" class="hidden">
    <h2>Key phrases</h2>
    <div id="results"></div>
  </section>

  <section id="phrasebook">
    <h2>My phrasebook</h2>
    <p id="empty-msg" class="empty">Nothing saved yet. Use "Save to my phrasebook" on a card.</p>
    <ul id="saved-list"></ul>
  </section>
</main>

<script>
  var PHRASES = []; // filled from the server response

  var canSpeak = "speechSynthesis" in window;

  // Read the scene aloud with the browser's built-in voice (free, no AI, no network).
  function speakScene(lines) {
    if (!canSpeak) return;
    window.speechSynthesis.cancel();
    lines.forEach(function (line) {
      var text = line.indexOf(": ") > -1 ? line.slice(line.indexOf(": ") + 2) : line;
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    });
  }

  var saved = []; // in-page only, no storage

  var findBtn = document.getElementById("find");
  var resultsSection = document.getElementById("results-section");
  var resultsEl = document.getElementById("results");
  var savedList = document.getElementById("saved-list");
  var emptyMsg = document.getElementById("empty-msg");
  var sourceEl = document.getElementById("source");
  var statusEl = document.getElementById("status");

  // Small helper: create an element with optional class and text (textContent only, so user input is never parsed as HTML).
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // "Your turn": the partner speaks a line, the learner replies, the server gives feedback.
  // The conversation is just data: a turn {who, line} in, a text reply out. Typing is only one way
  // to get the reply (getReply), so voice can replace it later without touching sendForFeedback.
  var MAX_REPLY = 300;
  var MAX_TRIES = 5;

  function sendForFeedback(phrase, line, reply) {
    return fetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phrase: phrase, line: line, reply: reply })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (!r.ok) throw new Error(data.error || "Something went wrong. Please try again.");
        return data;
      });
    });
  }

  function buildPractice(item, index) {
    var turn = item.practice; // {who, line}
    var tries = 0;
    var wrap = el("div", "practice");
    wrap.appendChild(el("h4", null, "Your turn"));

    var setup = el("div", "scene");
    setup.appendChild(el("div", "line", turn.who + ": " + turn.line));
    wrap.appendChild(setup);

    var inputId = "practice-" + index;
    var label = el("label", null, "Reply to " + turn.who + " using “" + item.phrase + "”");
    label.setAttribute("for", inputId);
    var input = el("textarea");
    input.id = inputId;
    input.rows = 2;
    input.maxLength = MAX_REPLY;
    wrap.appendChild(label);
    wrap.appendChild(input);

    var row = el("div", "row");
    var checkBtn = el("button", null, "Check");
    checkBtn.type = "button";
    var counter = el("span", "hint", MAX_REPLY + " characters left");
    row.appendChild(checkBtn);
    row.appendChild(counter);
    wrap.appendChild(row);

    var feedback = el("div", "feedback hidden");
    feedback.setAttribute("aria-live", "polite");
    wrap.appendChild(feedback);

    function getReply() { return input.value.trim(); } // voice later: return the transcript here

    input.addEventListener("input", function () {
      counter.textContent = (MAX_REPLY - input.value.length) + " characters left";
    });

    function showFeedback(kind, text) {
      var box = el("div", kind, text);
      feedback.appendChild(box);
      return box;
    }

    checkBtn.addEventListener("click", function () {
      var reply = getReply();
      feedback.className = "feedback";
      feedback.textContent = "";
      if (!reply) { showFeedback("warn", "Type a reply first, then press Check."); return; }
      checkBtn.disabled = true;
      checkBtn.textContent = "Checking…";
      sendForFeedback(item.phrase, turn.who + ": " + turn.line, reply).then(function (fb) {
        tries++;
        showFeedback(fb.ok ? "works" : "tip", fb.feedback);
        if (fb.better) showFeedback("better", "A better version: " + fb.better);
        if (fb.ok) {
          input.disabled = true;
          checkBtn.textContent = "Done";
          return; // button stays disabled
        }
        if (tries >= MAX_TRIES) {
          input.disabled = true;
          checkBtn.textContent = "Done";
          showFeedback("warn", "That was your " + MAX_TRIES + " tries for this phrase. Read the better version above, say it out loud, and move on to the next card. You can do it!");
          return;
        }
        showFeedback("warn", "Not quite yet. Edit your reply and press Check again (" + (MAX_TRIES - tries) + " tries left).");
        checkBtn.disabled = false;
        checkBtn.textContent = "Check";
      }).catch(function (err) {
        // A failed call does not count as a try.
        showFeedback("warn", err instanceof TypeError ? "Could not reach the server. Is it running (node server.js)?" : err.message);
        checkBtn.disabled = false;
        checkBtn.textContent = "Check";
      });
    });

    return wrap;
  }

  function buildCard(item, index) {
    var card = el("article", "card");
    card.appendChild(el("h3", null, item.phrase));

    card.appendChild(el("h4", null, "What it means"));
    card.appendChild(el("p", null, item.meaning));

    card.appendChild(el("h4", null, "From your text"));
    card.appendChild(el("p", "quote", "“" + item.sentence + "”"));

    card.appendChild(el("h4", null, "See the scene"));
    var scene = el("div", "scene");
    scene.appendChild(el("div", "tag", item.sceneType));
    item.scene.forEach(function (line) { scene.appendChild(el("div", "line", line)); });
    card.appendChild(scene);

    var listenRow = el("div", "row listen");
    var listenBtn = el("button", null, "🔊 Listen & repeat");
    listenBtn.type = "button";
    listenRow.appendChild(listenBtn);
    listenRow.appendChild(el("span", "hint", canSpeak ? "Listen, then say each line out loud." : "Read-aloud is not supported in this browser."));
    if (!canSpeak) listenBtn.disabled = true;
    listenBtn.addEventListener("click", function () { speakScene(item.scene); });
    card.appendChild(listenRow);

    if (item.practice) card.appendChild(buildPractice(item, index));

    var row = el("div", "row");
    var saveBtn = el("button", null, "Save to my phrasebook");
    saveBtn.type = "button";
    row.appendChild(saveBtn);
    card.appendChild(row);

    saveBtn.addEventListener("click", function () {
      if (saved.indexOf(index) === -1) {
        saved.push(index);
        renderPhrasebook();
      }
      saveBtn.textContent = "Saved";
      saveBtn.disabled = true;
    });

    return card;
  }

  function renderPhrasebook() {
    savedList.textContent = "";
    emptyMsg.className = saved.length ? "empty hidden" : "empty";
    saved.forEach(function (index) {
      var item = PHRASES[index];
      var li = el("li");
      li.appendChild(el("strong", null, item.phrase));
      li.appendChild(el("div", null, item.meaning));
      savedList.appendChild(li);
    });
  }

  // Remove old cards and saved phrases (they belong to the previous search).
  function clearResults() {
    PHRASES = [];
    saved = [];
    resultsEl.textContent = "";
    resultsSection.className = "hidden";
    renderPhrasebook();
  }

  function showError(msg) {
    statusEl.className = "status error";
    statusEl.textContent = msg;
  }

  findBtn.addEventListener("click", function () {
    var text = sourceEl.value.trim();
    if (!text) { showError("Please paste some text first."); return; }
    clearResults();
    findBtn.disabled = true;
    findBtn.textContent = "Finding phrases…";
    statusEl.className = "status";
    statusEl.textContent = "Reading your text. This can take a few seconds…";

    fetch("/api/phrases", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (!r.ok) throw new Error(data.error || "Something went wrong. Please try again.");
        return data;
      });
    }).then(function (data) {
      PHRASES = data.phrases;
      PHRASES.forEach(function (item, i) { resultsEl.appendChild(buildCard(item, i)); });
      statusEl.className = "status hidden";
      resultsSection.className = "";
      resultsSection.scrollIntoView({ behavior: "smooth" });
    }).catch(function (err) {
      showError(err instanceof TypeError ? "Could not reach the server. Is it running (node server.js)?" : err.message);
    }).then(function () {
      findBtn.disabled = false;
      findBtn.textContent = "Find key phrases";
    });
  });
</script>
</body>
</html>
